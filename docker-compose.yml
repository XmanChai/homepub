# 1) run the generator without installing Node:
#      docker compose run --rm homepub plan
# 2) run frpc with the generated config (pin the image tag to the version you trust):
#      docker compose --profile frpc up -d
services:
  homepub:
    build: .
    working_dir: /work
    volumes:
      - ./:/work

  frpc:
    # any frpc >= 0.52 image works; pin a digest/tag in real deployments
    image: snowdreamtech/frpc:0.61.2
    profiles: ["frpc"]
    restart: unless-stopped
    volumes:
      - ./out/client/frpc.toml:/etc/frp/frpc.toml:ro
