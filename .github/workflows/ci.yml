name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: unit tests
        run: npm test
      - name: generate output
        run: node bin/homepub.js apply --config examples/homepub.config.json --out out-example --token ci-token --ledger out-example/ports.json
      - name: shell syntax
        run: |
          bash -n out-example/client/install.sh
          bash -n out-example/server/install.sh
          bash -n out-example/server/acme.sh
      - name: install e2e (fake nginx/acme/systemctl)
        run: bash scripts/e2e-install.sh out-example